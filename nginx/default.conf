# SafeBox Energy IMS — nginx reverse proxy
#
# Catch-all server_name (`_`) means this config serves requests for:
#   - http://localhost
#   - http://<server-ip>
#   - http://safebox.ng        (and any other hostname pointing at this host)
#
# To restrict to a specific hostname, replace `server_name _;` with
# `server_name safebox.ng www.safebox.ng;`.

upstream safebox_app {
    server app:3001;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Basic hardening
    server_tokens off;
    client_max_body_size 25m;

    # Security headers (the app already sets X-Content-Type-Options & X-Frame-Options)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Uncomment to force HTTPS once certificates are installed ──────────────
    # location / { return 301 https://$host$request_uri; }

    location / {
        proxy_pass http://safebox_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

